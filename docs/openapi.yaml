openapi: 3.1.0
info:
  title: Stock Allocation Simulator API
  version: 0.1.0
  summary: Internal API of the stock allocation simulator.
  description: |
    This is the contract between the simulator and its only caller in v1: the adapter in
    my portfolio website's worker. It is written before the code. A CI test compares it
    with the schema that FastAPI generates, so the two cannot drift apart.

    The API is not reachable from the internet. It listens only inside a private Docker
    network. Every request still needs a bearer token.

    Not financial advice. All numbers come from a simulation on historical data.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://sim-api:8000
    description: Inside the private Docker network (production)
  - url: http://localhost:8000
    description: Local development
tags:
  - name: health
    description: Is the service alive? No token needed.
  - name: meta
    description: The choices a form can offer.
  - name: simulations
    description: Order a simulation and fetch its result.
  - name: model-portfolios
    description: The three live model portfolios and the daily snapshot.
  - name: instruments
    description: Stocks and ETFs the simulator knows, and their prices.
  - name: admin
    description: Only with the admin token. Used by the CLI and, later, admin pages.
security:
  - serviceToken: []

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: The process is running.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, version: 0.1.0 }

  /readyz:
    get:
      tags: [health]
      operationId: getReady
      summary: The process can reach the database.
      security: []
      responses:
        "200":
          description: Ready to take requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
              example:
                status: ok
                database: ok
                data_version: 412
                prices_as_of: "2026-11-13"
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/meta/options:
    get:
      tags: [meta]
      operationId: getOptions
      summary: Everything a form needs, risk levels, industries, themes and limits.
      description: Changes rarely. Safe to cache for an hour.
      responses:
        "200":
          description: The current options.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Options" }
              example:
                risk_levels:
                  - id: low
                    target_volatility: 0.08
                    max_weight_per_instrument: 0.25
                    max_weight_per_sector: 0.30
                    core_share: 0.80
                  - id: medium
                    target_volatility: 0.14
                    max_weight_per_instrument: 0.15
                    max_weight_per_sector: 0.35
                    core_share: 0.50
                  - id: high
                    target_volatility: 0.22
                    max_weight_per_instrument: 0.12
                    max_weight_per_sector: 0.45
                    core_share: 0.20
                industries:
                  - { id: healthcare, name: Healthcare }
                  - { id: technology, name: Technology }
                  - { id: defense, name: Defense }
                  - { id: energy, name: Energy }
                  - { id: financials, name: Financials }
                  - { id: consumer, name: Consumer }
                  - { id: industrials, name: Industrials }
                themes:
                  - { id: ai, name: Artificial intelligence }
                  - { id: clean-energy, name: Clean energy }
                strategies:
                  - { id: equal-weight, name: Equal weight }
                  - { id: inverse-volatility, name: Inverse volatility }
                  - { id: minimum-variance, name: Minimum variance }
                rebalance: [never, yearly, quarterly]
                benchmarks: [SPY, VTI, VT]
                default_benchmark: SPY
                capital: { min: 100, max: 10000000, currency: USD }
                time_span_years: { min: 1, max: 20 }
                prices_as_of: "2026-11-13"
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/simulations:
    post:
      tags: [simulations]
      operationId: createSimulation
      summary: Order a simulation.
      description: |
        Does not run the simulation. It puts a job in the queue and answers at once.

        Two ways a request does not create new work:
        - The same `Idempotency-Key` was used before: the first simulation is returned.
        - The same inputs were already simulated on the same data (`data_version`) with
          the same seed: the stored simulation is returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationParams" }
            examples:
              medium:
                summary: Medium risk, two industries, ten years
                value:
                  capital: 10000
                  risk_level: medium
                  time_span_years: 10
                  industries: [healthcare, technology]
                  themes: []
              minimal:
                summary: Only the required fields
                value:
                  capital: 5000
                  risk_level: low
                  time_span_years: 5
      responses:
        "202":
          description: Accepted. Ask again at the Location address.
          headers:
            Location:
              description: Where to fetch the simulation.
              schema: { type: string, examples: ["/v1/simulations/0193b6f4-5a3c-7e21-9c4d-2f8a6b1e7d05"] }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
              example:
                id: 0193b6f4-5a3c-7e21-9c4d-2f8a6b1e7d05
                status: queued
                params:
                  capital: 10000
                  risk_level: medium
                  time_span_years: 10
                  industries: [healthcare, technology]
                  themes: []
                  strategy: inverse-volatility
                  rebalance: yearly
                  benchmark: SPY
                  seed: 20261116
                created_at: "2026-11-16T09:12:04Z"
                started_at: null
                finished_at: null
                progress: 0
                result: null
                error: null
        "200":
          description: This simulation already exists. Nothing new was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The Idempotency-Key was used before with different inputs.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: https://github.com/yashcontractor04/stock-simulator/blob/main/docs/04-api.md#idempotency-conflict
                title: Idempotency key reused
                status: 409
                code: idempotency_conflict
                detail: This Idempotency-Key belongs to a simulation with different inputs.
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/simulations/{simulation_id}:
    parameters:
      - $ref: "#/components/parameters/SimulationId"
    get:
      tags: [simulations]
      operationId: getSimulation
      summary: Status of a simulation, and the result once it is ready.
      description: |
        While the status is `queued` or `running`, the answer has a `Retry-After` header
        and must not be cached. A finished simulation never changes, so it is sent with an
        `ETag` and a long `Cache-Control`.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The simulation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
