  /v1/snapshot/latest:
    get:
      tags: [model-portfolios]
      operationId: getLatestSnapshot
      summary: The daily snapshot, exactly as it is copied to Supabase.
      description: |
        This is the shape the public dashboard on my website reads. The `export_snapshot`
        job builds it once a day after the model portfolios are updated and writes it into
        the public table `sim_snapshots` in Supabase (column `payload`).

        It is small on purpose: at most 400 points per series and at most 25 positions per
        portfolio, so the whole thing stays under 256 KB.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
